version: '3.6'
services:
  # The e2e container reaches every service by name on the compose network, and
  # the host script uses `docker compose exec`. Publishing fixed host ports here
  # only risks bind conflicts on shared or concurrent runners, so reset the
  # mappings inherited from the databases and applications files.
  mysql:
    ports: !reset []
  localstack:
    ports: !reset []
  write-api-server-1:
    ports: !reset []
  dynamodb-read-model-updater-1:
    ports: !reset []
  read-api-server-1:
    ports: !reset []

  e2e-test:
    profiles:
      - e2e
    image: e2e-test-js:latest
    # イメージ内の焼き込みではなく、常にリポジトリ上のスクリプトを使う（待機ロジック等の変更が即反映される）
    volumes:
      - ../e2e-test:/e2e:ro
    entrypoint: ["bash", "/e2e/verify-group-chat.sh"]
    environment:
      WRITE_API_SERVER_BASE_URL: http://write-api-server-1:3000
      READ_API_SERVER_BASE_URL: http://read-api-server-1:3000
    depends_on:
      write-api-server-1:
        condition: service_started
      read-api-server-1:
        condition: service_started
