name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # GitHub uses edited both for base-branch changes and for metadata edits.
    types: [opened, synchronize, reopened, edited]
jobs:
  lint:
    runs-on: ubuntu-24.04
    name: "Run lint"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm run lint
  test:
    runs-on: ubuntu-24.04
    needs: lint
    env:
      TEST_TIME_FACTOR: 10.0
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm run test
  aislop:
    runs-on: ubuntu-24.04
    name: "Run aislop check"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm run check:aislop
          pnpm run test:aislop
  e2e:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 40
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run e2e
        run: |
          pnpm docker-build-e2e-test
          pnpm docker-build
          pnpm docker-compose-e2e-test
      - name: Dump e2e diagnostics
        if: failure()
        run: |
          docker compose -p cqrs-es-example-js-e2e \
            -f tools/docker-compose/docker-compose-databases.yml \
            -f tools/docker-compose/docker-compose-applications.yml \
            -f tools/docker-compose/docker-compose-e2e-test.yml \
            ps || true
          echo "=== Compose logs ==="
          docker compose -p cqrs-es-example-js-e2e \
            -f tools/docker-compose/docker-compose-databases.yml \
            -f tools/docker-compose/docker-compose-applications.yml \
            -f tools/docker-compose/docker-compose-e2e-test.yml \
            logs --no-color --tail=400 || true
  required-product-ci:
    name: Required product CI
    runs-on: ubuntu-24.04
    permissions: {}
    needs: [lint, test, e2e, aislop]
    # Inspect skipped and failed dependencies as well as successful ones.
    if: ${{ always() }}
    steps:
      - name: Require all product CI jobs to succeed
        if: ${{ always() }}
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AISLOP_RESULT: ${{ needs.aislop.result }}
          GATE_STATUS: ${{ job.status }}
        run: |
          printf '%s\n' "lint=$LINT_RESULT" "test=$TEST_RESULT" "e2e=$E2E_RESULT" "aislop=$AISLOP_RESULT" "gate=$GATE_STATUS"
          test "$GATE_STATUS" = success &&
            test "$LINT_RESULT" = success &&
            test "$TEST_RESULT" = success &&
            test "$E2E_RESULT" = success &&
            test "$AISLOP_RESULT" = success
