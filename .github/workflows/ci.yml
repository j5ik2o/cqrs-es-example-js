name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  lint:
    runs-on: ubuntu-24.04
    name: "Run lint"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm run lint
  test:
    runs-on: ubuntu-24.04
    needs: lint
    env:
      TEST_TIME_FACTOR: 10.0
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm run test
  e2e:
    runs-on: ubuntu-24.04
    needs: test
    env:
      TEST_TIME_FACTOR: 10.0
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.15.9
      - uses: unfor19/install-aws-cli-action@v1
        with:
          version: "2"
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run e2e
        run: |
          pnpm docker-build-e2e-test
          pnpm docker-build
          pnpm docker-compose-e2e-test
      - name: Dump e2e diagnostics
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: x
          AWS_SECRET_ACCESS_KEY: x
          AWS_DEFAULT_REGION: ap-northeast-1
          LOCALSTACK_ENDPOINT_URL: http://localhost:34566
        run: |
          echo "=== Lambda event source mappings ==="
          aws lambda list-event-source-mappings \
            --function-name read-model-updater-rmu \
            --endpoint-url "${LOCALSTACK_ENDPOINT_URL}" || true
          echo "=== Lambda log groups ==="
          aws logs describe-log-groups \
            --endpoint-url "${LOCALSTACK_ENDPOINT_URL}" || true
          echo "=== Lambda logs ==="
          aws logs filter-log-events \
            --log-group-name /aws/lambda/read-model-updater-rmu \
            --endpoint-url "${LOCALSTACK_ENDPOINT_URL}" \
            --limit 200 || true
          echo "=== Compose logs ==="
          docker compose -p cqrs-es-example-js \
            -f tools/docker-compose/docker-compose-databases.yml \
            -f tools/docker-compose/docker-compose-applications.yml \
            logs --no-color --tail=300 || true
